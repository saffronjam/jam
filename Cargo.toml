[workspace]
resolver = "3"
members = ["crates/jam-core", "crates/jam", "crates/jam-render", "crates/jam-native"]
[workspace.package]
license = "MIT"
repository = "https://github.com/saffronjam/jam"
edition = "2024"
version = "0.0.1"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jam-core = { path = "crates/jam-core" }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", default-features = false }
