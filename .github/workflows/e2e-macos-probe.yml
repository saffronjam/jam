name: macOS automation proof
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fixture_run:
        description: Optional completed Fixture release artifacts run
        type: string
        required: false
      cases:
        description: Explicit partial development selector
        type: string
        default: TERM-001 or CFG-001 or DRAG-001 or INPUT-005
        required: false
permissions:
  contents: read
  actions: read
jobs:
  native-driver:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APPIUM_HOME: ${{ github.workspace }}/.cache/appium-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install the pinned automation tools
        run: |
          python3 -m venv .cache/e2e-bootstrap
          .cache/e2e-bootstrap/bin/python -m pip install uv==0.13.5
          npm install --prefix .cache/appium appium@3.9.1
          .cache/appium/node_modules/.bin/appium driver install mac2@4.6.1
          sudo automationmodetool enable-automationmode-without-authentication
          .cache/appium/node_modules/.bin/appium driver doctor mac2
      - name: Fetch the unmodified published application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          mkdir -p .cache/stock
          gh release download v0.0.4 --repo saffronjam/jam --pattern Jam-v0.0.4-macos-arm64.zip --dir .cache/stock
          ditto -xk .cache/stock/Jam-v0.0.4-macos-arm64.zip .cache/stock
          codesign --verify --deep --strict .cache/stock/Jam.app
      - name: Select the fixture installation for an explicit diagnostic run
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_RUN: ${{ inputs.fixture_run }}
        run: |
          echo "PROBE_APP=$PWD/.cache/stock/Jam.app" >> "$GITHUB_ENV"
          if [ -n "$FIXTURE_RUN" ]; then
            gh run view "$FIXTURE_RUN" --json name,conclusion,headSha > fixture-source.json
            python3 - <<'PY'
          import json
          value = json.load(open('fixture-source.json'))
          assert value['name'] == 'Fixture release artifacts' and value['conclusion'] == 'success', value
          PY
            gh run download "$FIXTURE_RUN" -n fixture-release-bundle -D .cache/fixture-input
            mkdir -p .cache/fixture-bundle e2e/artifacts
            tar -xzf .cache/fixture-input/fixture-release-bundle.tar.gz -C .cache/fixture-bundle
            codesign --verify --deep --strict .cache/fixture-bundle/installation/Jam.app
            echo "PROBE_APP=$PWD/.cache/fixture-bundle/installation/Jam.app" >> "$GITHUB_ENV"
            echo "PROBE_BUNDLE=$PWD/.cache/fixture-bundle/manifest.json" >> "$GITHUB_ENV"
            mv fixture-source.json e2e/artifacts/fixture-source.json
          fi
      - name: Start native WebDriver
        run: |
          mkdir -p e2e/artifacts
          .cache/appium/node_modules/.bin/appium --address 127.0.0.1 --port 4723 --log "$PWD/e2e/artifacts/appium.log" &
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          deadline = time.monotonic() + 30
          while True:
              try:
                  with urlopen('http://127.0.0.1:4723/status', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(.2)
          PY
      - name: Probe terminal, settings, dragging and key input
        env:
          SELECTED_CASES: ${{ inputs.cases || 'TERM-001 or CFG-001 or DRAG-001 or INPUT-005' }}
        run: |
          fixture=()
          if [ -n "${PROBE_BUNDLE:-}" ]; then fixture=(--fixture-bundle "$PROBE_BUNDLE"); fi
          .cache/e2e-bootstrap/bin/uv run --project e2e --locked pytest -c e2e/pyproject.toml e2e/tests \
            --app "$PROBE_APP" --platform macos "${fixture[@]}" --allow-subset --maxfail=1 \
            -k "$SELECTED_CASES" \
            --artifacts-dir e2e/artifacts/probe --junitxml=e2e/artifacts/probe.xml
      - name: Check the installed stock release
        if: always()
        run: |
          .cache/e2e-bootstrap/bin/uv run --project e2e --locked pytest -c e2e/pyproject.toml e2e/installed \
            --app "$PWD/.cache/stock/Jam.app" --platform macos \
            --artifacts-dir e2e/artifacts/stock --junitxml=e2e/artifacts/stock.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-native-driver-proof
          path: e2e/artifacts/
          if-no-files-found: error
