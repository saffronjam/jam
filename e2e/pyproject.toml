[project]
name = "jam-e2e"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8,<10",
    "Appium-Python-Client>=5,<6",
    "lxml>=5,<7",
    "pillow>=11,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = ["acceptance: external application scenarios", "harness: automation infrastructure regression tests"]

[tool.ruff]
line-length = 100
