name: Desktop acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  fixtures:
    uses: ./.github/workflows/e2e-release-fixtures.yml
  desktop:
    needs: fixtures
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      APPIUM_HOME: ${{ github.workspace }}/.cache/appium-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install fixture prerequisites
        shell: bash
        run: |
          python3 -m venv .cache/e2e-bootstrap
          .cache/e2e-bootstrap/bin/python -m pip install uv==0.13.5
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
            brew list qemu >/dev/null 2>&1 || brew install qemu
            echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
            python3 e2e/fixtures/fetch_vm_image.py .cache/debian-bookworm-arm64.qcow2
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fixture-release-bundle
          path: build
      - name: Use the genuine managed fixture installations
        shell: bash
        run: |
          mkdir -p .cache/e2e-bundle
          tar -xzf build/fixture-release-bundle.tar.gz -C .cache/e2e-bundle
          ssh_fixture=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            app="$PWD/.cache/e2e-bundle/installation/Jam.app"
            codesign --verify --deep --strict "$app"
            echo "E2E_CLI=$app/Contents/Resources/bin/jam" >> "$GITHUB_ENV"
            echo "E2E_DAEMON=$app/Contents/MacOS/jamd" >> "$GITHUB_ENV"
            ssh_fixture=(
              --remote-archive "$PWD/.cache/e2e-bundle/releases/v0.0.4/jam-v0.0.4-linux-aarch64.tar.gz"
              --vm-image "$PWD/.cache/debian-bookworm-arm64.qcow2"
              --qemu "$(command -v qemu-system-aarch64)" --qemu-img "$(command -v qemu-img)"
              --vm-firmware "$(brew --prefix qemu)/share/qemu/edk2-aarch64-code.fd"
            )
          else
            mkdir -p build/fixture-server
            tar -xzf .cache/e2e-bundle/releases/v0.0.4/jam-v0.0.4-linux-x86_64.tar.gz -C build/fixture-server
            echo "E2E_CLI=$PWD/build/fixture-server/jam" >> "$GITHUB_ENV"
            echo "E2E_DAEMON=$PWD/build/fixture-server/jamd" >> "$GITHUB_ENV"
          fi
          python3 e2e/fixtures/build_bundle.py .cache/current-bundle \
            --trust .cache/e2e-bundle/trust --releases .cache/e2e-bundle/releases "${ssh_fixture[@]}"
      - name: Verify external provider and release dependencies
        shell: bash
        run: |
          .cache/e2e-bootstrap/bin/uv run --project e2e --locked pytest -c e2e/pyproject.toml e2e/checks \
            --cli "$E2E_CLI" --daemon "$E2E_DAEMON" \
            --fixture-bundle .cache/current-bundle/manifest.json --junitxml=e2e/artifacts/dependencies.xml
      - name: Provision Mac2 in the native graphical session
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm install --prefix .cache/appium appium@3.9.1
          .cache/appium/node_modules/.bin/appium driver install mac2@4.6.1
          sudo automationmodetool enable-automationmode-without-authentication
          .cache/appium/node_modules/.bin/appium driver doctor mac2
          mkdir -p e2e/artifacts
          .cache/appium/node_modules/.bin/appium --address 127.0.0.1 --port 4723 --log "$PWD/e2e/artifacts/appium.log" &
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          deadline = time.monotonic() + 30
          while True:
              try:
                  with urlopen('http://127.0.0.1:4723/status', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(.2)
          PY
      - name: Probe native automation before the complete run
        if: runner.os == 'macOS'
        shell: bash
        run: |
          .cache/e2e-bootstrap/bin/uv run --project e2e --locked pytest -c e2e/pyproject.toml e2e/tests \
            --app "$PWD/.cache/e2e-bundle/installation/Jam.app" --platform macos \
            --fixture-bundle "$PWD/.cache/current-bundle/manifest.json" \
            --allow-subset --maxfail=1 -k 'TERM-001 or CFG-001 or DRAG-001 or INPUT-005' \
            --artifacts-dir e2e/artifacts/probe --junitxml=e2e/artifacts/probe.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && runner.os == 'macOS'
        with:
          name: native-automation-probe
          path: e2e/artifacts/
          if-no-files-found: error
      - name: Fetch the published stock macOS release
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/stock
          gh release download v0.0.4 --repo saffronjam/jam --pattern Jam-v0.0.4-macos-arm64.zip --dir .cache/stock
          ditto -xk .cache/stock/Jam-v0.0.4-macos-arm64.zip .cache/stock
          codesign --verify --deep --strict .cache/stock/Jam.app
      - name: Smoke the unmodified installed stock artifact
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          .cache/e2e-bootstrap/bin/uv run --project e2e --locked pytest -c e2e/pyproject.toml e2e/installed \
            --app "$PWD/.cache/stock/Jam.app" --platform macos \
            --artifacts-dir e2e/artifacts/stock --junitxml=e2e/artifacts/stock.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && runner.os == 'macOS'
        with:
          name: stock-macos-smoke
          path: e2e/artifacts/stock*
          if-no-files-found: error
      - name: Run the complete shared desktop contract
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            app="$PWD/.cache/e2e-bundle/installation/Jam.app"
            platform=macos
            binaries=()
          else
            app="$PWD/build/linux/bin/Jam"
            platform=linux
            binaries=(--cli "$E2E_CLI" --daemon "$E2E_DAEMON")
          fi
          .cache/e2e-bootstrap/bin/uv run --project e2e --locked pytest -c e2e/pyproject.toml e2e/tests \
            --app "$app" --platform "$platform" "${binaries[@]}" \
            --fixture-bundle "$PWD/.cache/current-bundle/manifest.json" \
            --junitxml=e2e/artifacts/acceptance.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-acceptance-${{ matrix.os }}
          path: e2e/artifacts/
          if-no-files-found: error
